[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resultathle"
version = "0.1.0"
description = "Scrape and analyze athletics competition results from bases.athle.fr"
authors = [
    {name = "Kirscher"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.3",
    "lxml>=5.2.1",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pylint>=2.0.0",
]

[project.scripts]
resultathle = "resultathle.cli:main"

[project.urls]
Homepage = "https://github.com/Kirscher/ResultAthle"
Repository = "https://github.com/Kirscher/ResultAthle"

[tool.setuptools]
packages = ["resultathle"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
resultathle = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=resultathle --cov-report=term-missing"

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
]
